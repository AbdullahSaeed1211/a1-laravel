name = "a1-blog-reverse-proxy"
main = "src/index.js"
compatibility_date = "2024-01-01"
workers_dev = false

routes = [
  { pattern = "www.a1traininggroupllc.com/blog*", zone_name = "a1traininggroupllc.com" },
  { pattern = "a1traininggroupllc.com/blog*", zone_name = "a1traininggroupllc.com" },
  { pattern = "www.a1traininggroupllc.com/robots.txt", zone_name = "a1traininggroupllc.com" },
]

[vars]
UPSTREAM_ORIGIN = "https://blogs.a1traininggroupllc.com"
UPSTREAM_BLOG_BASE_PATH = "/blog"
UPSTREAM_HOME_PATH = "/"
PUBLIC_BLOG_PREFIX = "/blog"
FORCE_PUBLIC_HOST = "www.a1traininggroupllc.com"
PROXY_BYPASS_HEADER = "x-a1-proxy"
PROXY_BYPASS_VALUE = "1"
